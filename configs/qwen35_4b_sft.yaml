model_name: Qwen/Qwen3.5-4B-Base
stage: sft
base_adapter: outputs/qwen_andaluh_4b_cpt/final_adapter
train_file: data/processed/sft_andaluh/train.jsonl
valid_file: data/processed/sft_andaluh/valid.jsonl
output_dir: outputs/qwen_andaluh_4b_sft
