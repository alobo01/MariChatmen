[project]
name = "marichatmen"
version = "0.1.0"
description = "Always-Andaluh Sevillian-leaning chat model training pipeline with QLoRA, TRL SFT, ORPO, and optional GRPO."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Antonio Lobo" }]
dependencies = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "transformers[torch] @ git+https://github.com/huggingface/transformers.git@main",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
    "trl>=1.0.0",
    "bitsandbytes>=0.48.0",
    "safetensors>=0.4.5",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
    "huggingface-hub>=0.30.0",
    "wandb>=0.18.0",
    "rich>=13.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "sacrebleu>=2.4.0",
    "evaluate>=0.4.3",
    "rapidfuzz>=3.9.0",
    "regex>=2024.0.0",
    "pyyaml>=6.0.2",
    "andaluh==0.3.1",
    "pytest>=8.0.0",
]

[project.scripts]
marichatmen-chat = "marichatmen.serve.chat:main"
marichatmen-benchmark = "marichatmen.eval.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marichatmen"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
python-preference = "managed"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
